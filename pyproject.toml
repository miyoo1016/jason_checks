[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jason-checks"
version = "0.1.0"
description = "CHECKS-like terminal trading UI using KIS Open API"
authors = [{name = "Jason", email = "jason@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60.0",
    "rich>=13.0.0",
    "websockets>=12.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["jason_checks"]

[tool.setuptools.package-dir]
"" = "src"
