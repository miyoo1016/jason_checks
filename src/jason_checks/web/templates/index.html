<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECKS Terminal — Real-time Stock Trading</title>

    <!-- TailwindCSS CDN (for layout utilities) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS (Theme) -->
    <link rel="stylesheet" href="/static/css/checks.css">
</head>
<body>
    <div id="app" x-data="timaApp()" x-init="init()">
        <!-- Header -->
        <header class="p-4 sticky top-0 z-10">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-6">
                    <div>
                        <h1 class="text-2xl font-black tracking-tighter">CHECKS Terminal</h1>
                        <p class="text-[10px] opacity-60 font-bold uppercase tracking-tight">KIS Open API — Premium Real-time Analytics</p>
                    </div>
                    <!-- Market Toggle Switch -->
                    <div class="flex bg-gray-100 p-0.5 rounded-lg text-[10px] font-black border border-gray-200">
                        <button @click="setMarket('KR')" 
                                :class="market === 'KR' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-400'"
                                class="px-4 py-1.5 rounded-md transition-all duration-200">KOREA</button>
                        <button @click="setMarket('US')" 
                                :class="market === 'US' ? 'bg-white shadow-sm text-red-600' : 'text-gray-400'"
                                class="px-4 py-1.5 rounded-md transition-all duration-200">USA</button>
                    </div>
                </div>
                <div class="flex gap-4 items-center">
                    <!-- Tab Navigation -->
                    <nav class="flex gap-1 bg-gray-100 p-1 rounded-xl">
                        <button @click="currentTab = 'dashboard'" 
                                :class="currentTab === 'dashboard' ? 'bg-white shadow-sm text-black' : 'text-gray-500'"
                                class="px-4 py-2 rounded-lg text-xs font-bold transition-all">실시간 대시보드</button>
                        <button @click="currentTab = 'scan'" 
                                :class="currentTab === 'scan' ? 'bg-white shadow-sm text-black' : 'text-gray-500'"
                                class="px-4 py-2 rounded-lg text-xs font-bold transition-all">📊 가치투자 스캔</button>
                    </nav>
                    <div class="text-right text-sm">
                        <div class="font-bold" x-text="`${currentTime}`"></div>
                        <div class="text-xs opacity-60" x-text="`MODE: ${mode.toUpperCase()}`"></div>
                    </div>
                    <button @click="copyDashboardText()"
                            class="copy-all-btn"
                            :class="{ 'success': copyStatus === 'success', 'error': copyStatus === 'error' }"
                            x-text="copyButtonText()"></button>
                    <button @click="saveSignalJournal()"
                            class="copy-all-btn"
                            :class="{ 'success': signalSaveStatus === 'success', 'error': signalSaveStatus === 'error' }"
                            x-text="signalSaveButtonText()"></button>
                </div>
            </div>
        </header>
        
        <!-- Market Index Bar (KOSPI / KOSDAQ) -->
        <div class="bg-white border-b border-gray-200 py-2 sticky top-[73px] z-10 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-3">
                <template x-for="code in Object.keys(indices)" :key="code">
                    <div class="flex items-center justify-between gap-3 rounded-lg border border-gray-100 bg-gray-50 px-3 py-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="text-sm font-black tracking-tighter" x-text="indices[code]?.name"></span>
                            <span class="text-sm mono font-bold"
                                  :class="{'up': (indices[code]?.change_pct || 0) > 0, 'down': (indices[code]?.change_pct || 0) < 0}"
                                  x-text="(indices[code]?.price || 0).toFixed(2)"></span>
                            <span class="text-xs mono font-bold"
                                  :class="{'up': (indices[code]?.change_pct || 0) > 0, 'down': (indices[code]?.change_pct || 0) < 0}"
                                  x-text="`${(indices[code]?.change_pct || 0) >= 0 ? '▲' : '▼'} ${Math.abs(indices[code]?.change_pct || 0).toFixed(2)}%`"></span>
                        </div>
                        <div class="w-28 h-8 flex-shrink-0" x-html="sparklineSvg(indexChart(indices[code], code), 112, 32)"></div>
                        <div class="hidden lg:flex items-center gap-1 text-[10px] mono font-bold">
                            <span class="px-1.5 py-0.5 rounded bg-red-50" :class="indexSupplyClass(indices[code], 'investor_foreigner')"
                                  x-text="`외 ${formatIndexSupplyFlow(indices[code], 'investor_foreigner')}`"></span>
                            <span class="px-1.5 py-0.5 rounded bg-blue-50" :class="indexSupplyClass(indices[code], 'investor_institution')"
                                  x-text="`기 ${formatIndexSupplyFlow(indices[code], 'investor_institution')}`"></span>
                            <span class="px-1.5 py-0.5 rounded bg-gray-100" :class="indexSupplyClass(indices[code], 'investor_individual')"
                                  x-text="`개 ${formatIndexSupplyFlow(indices[code], 'investor_individual')}`"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Session Indicator Bar -->
        <div class="bg-white border-b border-gray-200 py-2 sticky top-[125px] z-10 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 flex gap-4 items-center justify-center text-[11px] font-bold">
                <span class="text-gray-500">SESSION:</span>
                <template x-if="market === 'KR'">
                    <div class="flex gap-4">
                        <span x-show="sessionType === 'pre'" class="text-purple-600">🌅 PRE-MARKET (NXT 08:00-08:50)</span>
                        <span x-show="sessionType === 'regular'" class="text-green-600">📈 REGULAR (KRX+NXT 09:00-15:30)</span>
                        <span x-show="sessionType === 'after'" class="text-orange-600">🌆 AFTER-MARKET (NXT 15:30-20:00)</span>
                        <span x-show="sessionType === 'closed'" class="text-gray-400">🌙 MARKET CLOSED</span>
                    </div>
                </template>
                <template x-if="market === 'US'">
                    <div class="flex gap-4">
                        <span x-show="sessionType === 'pre'" class="text-purple-600">🌅 US PRE-MARKET (17:00-22:30 KST)</span>
                        <span x-show="sessionType === 'regular'" class="text-green-600">📈 US REGULAR (22:30-05:00 KST)</span>
                        <span x-show="sessionType === 'after'" class="text-orange-600">🌆 US AFTER-MARKET (05:00-09:00 KST)</span>
                        <span x-show="sessionType === 'closed'" class="text-gray-400">🌙 MARKET CLOSED</span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Main Content -->
        <main class="max-w-[1600px] mx-auto p-3 md:p-4">
            <!-- DASHBOARD TAB -->
            <template x-if="currentTab === 'dashboard'">
                <div>
                    <!-- Status Bar -->
                    <div class="mb-2 p-2 rounded-lg border bg-white shadow-sm flex flex-col md:flex-row justify-between items-center gap-2">
                        <div class="flex flex-wrap gap-x-4 gap-y-1 text-[11px] font-bold uppercase tracking-wider">
                            <div>
                                <span x-show="wsConnected" class="text-green-600">🟢 WS:OK</span>
                                <span x-show="!wsConnected" class="text-red-500">🔴 WS:OFFLINE</span>
                            </div>
                            <div class="text-gray-400">REST:READY</div>
                            <div x-text="`TYPE: ${mode.toUpperCase()}`"></div>
                            <div x-show="marketOpen()" class="text-blue-600">MARKET OPEN</div>
                            <div x-show="!marketOpen()" class="text-amber-600">MARKET CLOSED</div>
                            <div class="text-emerald-700 normal-case" x-text="quoteLoadText()"></div>
                            <div class="text-gray-500 normal-case" x-text="`마지막 갱신: ${formatClock(quotePolling.updated_at || quotePolling.completed_at)}`"></div>
                            <div class="text-gray-500 normal-case" x-text="quoteEtaText()"></div>
                            <div x-show="supplyDataReason" class="text-gray-400 normal-case"
                                 x-text="`수급 DATA_NA: ${supplyDataReason}`"></div>
                            <div x-show="alphaforgeCandidatesLoaded > 0" class="text-blue-600 normal-case"
                                 x-text="`AlphaForge 후보 로드: ${alphaforgeCandidatesLoaded}개 / ${alphaforgeCandidatesGeneratedAt || '-'}`"></div>
                        </div>
                        <!-- Sort Toggle -->
                        <div class="flex gap-2">
                            <button @click="setSortMode('default')"
                                    :class="sortMode === 'default' ? 'active' : ''"
                                    class="sort-btn">
                                기본
                            </button>
                            <button @click="setSortMode('strength')"
                                    :class="sortMode === 'strength' ? 'active' : ''"
                                    class="sort-btn">
                                체결강도
                            </button>
                            <button @click="setSortMode('change_pct')"
                                    :class="sortMode === 'change_pct' ? 'active' : ''"
                                    class="sort-btn">
                                상승률
                            </button>
                            <button @click="setSortMode('trading_value')"
                                    :class="sortMode === 'trading_value' ? 'active' : ''"
                                    class="sort-btn">
                                거래대금
                            </button>
                        </div>
                    </div>

                    <!-- Theme Grid (compact responsive) -->
                    <template x-if="Object.keys(themes || {}).length === 0">
                        <div class="mb-4 rounded border border-amber-200 bg-amber-50 px-3 py-2 text-xs font-bold text-amber-800"
                             x-text="`산업군 데이터 없음${themeLoadReason ? ': ' + themeLoadReason : ''}`"></div>
                    </template>

                    <!-- Action Board -->
                    <div class="mb-2 rounded-lg border bg-white shadow-sm px-3 py-2">
                        <div class="flex flex-wrap items-center gap-2 text-[11px] font-black">
                            <span class="text-gray-500 uppercase tracking-wider">오늘의 행동판</span>
                            <span class="px-2 py-0.5 rounded text-white"
                                  :class="decisionCounts.BUY_NOW > 0 ? 'bg-green-600' : 'bg-gray-200 text-gray-500'"
                                  x-text="`BUY_NOW ${decisionCounts.BUY_NOW || 0}`"></span>
                            <span class="px-2 py-0.5 rounded text-white"
                                  :class="decisionCounts.STARTER_POSITION > 0 ? 'bg-blue-500' : 'bg-gray-200 text-gray-500'"
                                  x-text="`STARTER ${decisionCounts.STARTER_POSITION || 0}`"></span>
                            <span class="px-2 py-0.5 rounded text-white"
                                  :class="decisionCounts.CONDITIONAL_BUY > 0 ? 'bg-amber-500' : 'bg-gray-200 text-gray-500'"
                                  x-text="`CONDITIONAL ${decisionCounts.CONDITIONAL_BUY || 0}`"></span>
                            <span class="px-2 py-0.5 rounded bg-gray-400 text-white"
                                  x-text="`WATCH ${decisionCounts.WATCH_ONLY || 0}`"></span>
                            <span class="px-2 py-0.5 rounded bg-red-100 text-red-700"
                                  x-text="`AVOID ${decisionCounts.AVOID || 0}`"></span>
                            <template x-if="!deHasBuySignal() && deActionBoardTotal() > 0">
                                <span class="text-gray-400 normal-case font-bold">— 오늘 매수추천 없음</span>
                            </template>
                            <span class="ml-auto text-gray-400 normal-case font-medium"
                                  x-text="decisionSession === 'REGULAR' ? (decisionMarketGate?.reason || '') : '장 마감 — 내일 장중 확인'"></span>
                        </div>
                        <div class="mt-1 text-[10px] font-bold text-blue-700 truncate"
                             x-text="deSetupTop3Text()"></div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-5 gap-2 mb-4">
                        <div class="theme-card" style="padding: 0.45rem; border-radius: 7px;">
                            <div class="mb-1.5 pb-1.5 border-b border-gray-100">
                                <div class="grid grid-cols-[minmax(0,1fr)_auto] gap-1.5 items-center">
                                    <h2 class="text-[12px] font-black truncate">AlphaForge Picks</h2>
                                    <span class="mono text-[9px] font-black text-blue-700 bg-blue-50 rounded px-1.5 py-0.5"
                                          x-text="`${alphaForgePicks().length}개`"></span>
                                </div>
                            </div>
                            <div class="space-y-0.5">
                                <template x-for="stock in alphaForgePicks().slice(0, 5)" :key="`af-grid-${stock.code}`">
                                    <div class="stock-row"
                                         :class="{ 'limit-up': stock.change_pct >= 29.5, 'opacity-50': !isLiveStock(stock) }"
                                         style="padding: 0.23rem 0.35rem; margin-bottom: 0.125rem; border-radius: 5px;">
                                        <div class="grid grid-cols-[minmax(0,1fr)_52px_44px_44px] gap-1.5 items-center leading-tight">
                                            <div class="min-w-0 flex items-baseline gap-1">
                                                <span class="text-[10px] font-black truncate" x-text="stock.name"></span>
                                                <span class="text-[7px] text-gray-400 mono flex-shrink-0" x-text="stock.code"></span>
                                            </div>
                                            <div class="text-right text-[10px] mono font-black"
                                                 :class="{ 'up': stock.change_pct > 0, 'down': stock.change_pct < 0, 'text-gray-400': !isLiveStock(stock) }"
                                                 x-text="isLiveStock(stock) ? Number(stock.price).toLocaleString('ko-KR') : '-'"></div>
                                            <div class="text-right text-[9px] mono font-black"
                                                 :class="{ 'up': stock.change_pct > 0, 'down': stock.change_pct < 0, 'text-gray-400': !isLiveStock(stock) }"
                                                 x-text="isLiveStock(stock) ? fmtPct(stock.change_pct) : '-'"></div>
                                            <div class="text-right text-[9px] mono font-black text-gray-600"
                                                 x-text="isLiveStock(stock) ? formatTradingValue(stock.cumulative_trading_value) : '-'"></div>
                                        </div>
                                        <div class="mt-0.5 grid grid-cols-[minmax(0,1fr)_64px] gap-1 items-center leading-none">
                                            <div class="min-w-0 flex gap-1 text-[7px] font-black">
                                                <span class="px-1 py-0.5 rounded bg-blue-50 text-blue-700 truncate"
                                                      x-text="stock.alert_type || '-'"></span>
                                                <span class="px-1 py-0.5 rounded bg-green-50 text-green-700"
                                                      x-text="`RS ${stock.rs ?? '-'}`"></span>
                                                <span class="px-1 py-0.5 rounded bg-purple-50 text-purple-700 truncate"
                                                      x-text="stock.vcp_status || '-'"></span>
                                            </div>
                                            <div class="w-[64px] h-[18px] justify-self-end" x-html="sparklineSvg(stockChart(stock), 64, 18)"></div>
                                        </div>
                                        <!-- Decision Engine Badge Row -->
                                        <div class="mt-0.5 flex flex-wrap gap-1 items-center leading-none">
                                            <span class="px-1 py-0.5 rounded text-[7px] font-black"
                                                  :class="deDecisionBadgeClass(stock.de_decision)"
                                                  x-text="deDecisionText(stock)"></span>
                                            <span class="text-[7px] mono font-black text-gray-500"
                                                  x-text="deConfidenceText(stock)"></span>
                                            <span class="text-[7px] mono font-black text-gray-400"
                                                  x-text="deDataConfidenceText(stock)"></span>
                                            <span x-show="stock.de_chase_risk" class="px-1 py-0.5 rounded text-[7px] font-black bg-orange-100 text-orange-700">추격주의</span>
                                            <span class="text-[7px] mono text-gray-400"
                                                  x-text="`비중 ${deMaxPositionText(stock)}`"></span>
                                        </div>
                                        <!-- No-buy / entry trigger -->
                                        <template x-if="stock.de_no_buy_reason">
                                            <div class="mt-0.5 text-[7px] text-red-500 font-bold truncate"
                                                 x-text="`이유: ${stock.de_no_buy_reason}`"></div>
                                        </template>
                                        <div class="mt-0.5 flex flex-wrap gap-1 items-center leading-none">
                                            <span class="text-[7px] mono font-black text-blue-700"
                                                  x-text="`setup ${deSetupScoreText(stock)}`"></span>
                                            <span class="px-1 py-0.5 rounded text-[7px] font-black bg-blue-50 text-blue-700"
                                                  x-text="deSetupLabelText(stock)"></span>
                                        </div>
                                        <template x-if="stock.de_setup_reason">
                                            <div class="mt-0.5 text-[7px] text-gray-500 font-bold truncate"
                                                 x-text="`셋업: ${stock.de_setup_reason}`"></div>
                                        </template>
                                        <template x-if="!stock.de_no_buy_reason && stock.de_action_reason">
                                            <div class="mt-0.5 text-[7px] text-gray-500 font-bold truncate"
                                                 x-text="`이유: ${stock.de_action_reason}`"></div>
                                        </template>
                                        <template x-if="stock.de_next_session_trigger || stock.de_entry_trigger">
                                            <div class="mt-0.5 text-[7px] text-amber-600 font-bold truncate"
                                                 x-text="`내일 트리거: ${stock.de_next_session_trigger || stock.de_entry_trigger}`"></div>
                                        </template>
                                        <template x-if="stock.de_next_session_plan">
                                            <div class="mt-0.5 text-[7px] text-gray-500 font-bold truncate"
                                                 x-text="`계획: ${stock.de_next_session_plan}`"></div>
                                        </template>
                                        <template x-if="stock.de_invalidation">
                                            <div class="mt-0.5 text-[7px] text-gray-400 truncate"
                                                 x-text="`무효: ${stock.de_invalidation}`"></div>
                                        </template>
                                        <template x-if="stock.de_required_confirmations && stock.de_required_confirmations.length">
                                            <div class="mt-0.5 text-[7px] text-gray-400 truncate"
                                                 x-text="`확인: ${stock.de_required_confirmations.join(', ')}`"></div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="alphaForgePicks().length === 0">
                                    <div class="dual-horizon-empty">후보 대기</div>
                                </template>
                            </div>
                        </div>
                        <template x-for="entry in sortedThemeEntries()" :key="entry[0]">
                            <div class="theme-card" x-data="{ themeName: entry[0], themeData: entry[1] }"
                                 style="padding: 0.45rem; border-radius: 7px;">
                                <!-- Theme Header -->
                                <div class="mb-1.5 pb-1.5 border-b border-gray-100">
                                    <div class="grid grid-cols-[minmax(0,1fr)_auto_auto_auto] gap-1.5 items-center">
                                        <h2 class="text-[12px] font-black truncate" x-text="themeData.display_name"></h2>
                                        <span class="mono text-[10px] font-black px-1.5 py-0.5 rounded bg-gray-50"
                                              :class="{
                                                 'up': (themeData.avg_change_pct || 0) >= 0,
                                                 'down': (themeData.avg_change_pct || 0) < 0
                                               }"
                                              x-text="`${(themeData.avg_change_pct || 0) >= 0 ? '+' : ''}${(themeData.avg_change_pct || 0).toFixed(2)}%`">
                                        </span>
                                        <span class="mono text-[9px] font-black text-gray-500"
                                              x-text="`S ${(themeData.strength || 0).toFixed(0)}`"></span>
                                        <button @click="togglePin(themeName)" class="star-icon text-sm leading-none flex-shrink-0"
                                                :class="{ 'pinned': isPinned(themeName) }">
                                            <span x-text="isPinned(themeName) ? '★' : '☆'"></span>
                                        </button>
                                    </div>
                                </div>

                                <!-- Stock Rows -->
                                <div class="space-y-0.5">
                                    <template x-for="stock in compactLeaders(themeData)" :key="stock.code">
                                        <div class="stock-row"
                                             :class="{ 'limit-up': stock.change_pct >= 29.5, 'opacity-50': !isLiveStock(stock) }"
                                             style="padding: 0.23rem 0.35rem; margin-bottom: 0.125rem; border-radius: 5px;">
                                            <div class="grid grid-cols-[minmax(0,1fr)_52px_44px_44px] gap-1.5 items-center leading-tight">
                                                <div class="min-w-0 flex items-baseline gap-1">
                                                    <span class="text-[10px] font-black truncate" x-text="stock.name"></span>
                                                    <span x-show="stock.surge_active" class="surge-indicator">▲</span>
                                                    <span class="text-[7px] text-gray-400 mono flex-shrink-0" x-text="stock.code"></span>
                                                </div>
                                                <div class="text-right text-[10px] mono font-black"
                                                     :class="{ 'up': stock.change_pct > 0, 'down': stock.change_pct < 0, 'text-gray-400': !isLiveStock(stock) }"
                                                     x-text="isLiveStock(stock) ? Number(stock.price).toLocaleString('ko-KR') : '-'"></div>
                                                <div class="text-right text-[9px] mono font-black"
                                                     :class="{ 'up': stock.change_pct > 0, 'down': stock.change_pct < 0, 'text-gray-400': !isLiveStock(stock) }"
                                                     x-text="isLiveStock(stock) ? fmtPct(stock.change_pct) : '-'"></div>
                                                <div class="text-right text-[9px] mono font-black text-gray-600"
                                                     x-text="isLiveStock(stock) ? formatTradingValue(stock.cumulative_trading_value) : '-'"></div>
                                            </div>
                                            <div class="mt-0.5 grid grid-cols-[46px_minmax(0,1fr)_64px] gap-1 items-center leading-none">
                                                <span class="text-[8px] mono font-black text-gray-600"
                                                      x-text="`체결 ${formatStrength(stock.strength)}`"></span>
                                                <span class="text-[7px] text-gray-400 truncate"
                                                      x-text="supplyBadge(stock)"></span>
                                                <div class="w-[64px] h-[18px] justify-self-end" x-html="sparklineSvg(stockChart(stock), 64, 18)"></div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Dual Horizon Scanner -->
                    <div class="dual-horizon-panel mb-4">
                        <div class="flex justify-between items-center mb-3">
                            <h2 class="text-sm font-bold">Dual Horizon Scanner</h2>
                            <span class="text-[10px] font-bold text-gray-400" x-text="`AlphaForge ${alphaForgePicks().length} · Live ${liveMomentumPicks().length} · Overlap ${overlapPicks().length}`"></span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                                <h3 class="dual-horizon-title">Live Momentum Picks</h3>
                                <div class="space-y-1">
                                    <template x-for="stock in liveMomentumPicks()" :key="`lm-${stock.code}`">
                                        <div class="dual-horizon-item">
                                            <div class="flex justify-between gap-2">
                                                <div class="min-w-0">
                                                    <div class="text-xs font-bold truncate" x-text="stock.name || stock.code"></div>
                                                    <div class="text-[9px] text-gray-400 mono" x-text="stock.code"></div>
                                                </div>
                                                <span class="dual-horizon-label" x-text="stock.horizon_label"></span>
                                            </div>
                                            <div class="mt-1 flex justify-between text-[9px] mono font-bold">
                                                <span :class="{ 'up': stock.change_pct > 0, 'down': stock.change_pct < 0 }" x-text="`${(stock.change_pct || 0).toFixed(2)}%`"></span>
                                                <span x-text="`강도 ${formatStrength(stock.strength)}`"></span>
                                                <span x-text="stock.cumulative_trading_value ? `${(stock.cumulative_trading_value / 100000000).toFixed(0)}억` : '-'"></span>
                                            </div>
                                        </div>
                                    </template>
                                    <template x-if="liveMomentumPicks().length === 0">
                                        <div class="dual-horizon-empty">조건 만족 종목 없음</div>
                                    </template>
                                </div>
                            </div>

                            <div>
                                <h3 class="dual-horizon-title">Overlap Picks</h3>
                                <div class="space-y-1">
                                    <template x-for="stock in overlapPicks()" :key="`ov-${stock.code}`">
                                        <div class="dual-horizon-item overlap">
                                            <div class="flex justify-between gap-2">
                                                <div class="min-w-0">
                                                    <div class="text-xs font-bold truncate" x-text="stock.name || stock.code"></div>
                                                    <div class="text-[9px] text-gray-400 mono" x-text="stock.code"></div>
                                                </div>
                                                <span class="dual-horizon-label overlap" x-text="stock.horizon_label"></span>
                                            </div>
                                            <div class="mt-1 text-[9px] text-gray-500 truncate"
                                                 x-text="`등락 ${fmtPct(stock.change_pct)} · 강도 ${formatStrength(stock.strength)}`"></div>
                                        </div>
                                    </template>
                                    <template x-if="overlapPicks().length === 0">
                                        <div class="dual-horizon-empty">동시 충족 종목 없음</div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Surge Panel -->
                    <div class="surge-panel mb-6">
                        <div class="flex justify-between items-center mb-3">
                            <h2 class="text-sm font-bold flex items-center gap-2">
                                <span class="text-orange-500">🔥</span>
                                개별 급등주
                            </h2>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-5 gap-2">
                            <template x-for="stock in surges" :key="stock.code">
                                <div class="surge-item">
                                    <div class="text-xs font-bold truncate" x-text="stock.name"></div>
                                    <div class="flex justify-between items-end mt-1">
                                        <div class="mono text-xs" :class="{ 'up': stock.change_pct > 0, 'down': stock.change_pct < 0 }" x-text="stock.price?.toLocaleString()"></div>
                                        <div class="text-[11px] font-bold mono" :class="{ 'up': stock.change_pct > 0, 'down': stock.change_pct < 0 }" x-text="`${(stock.change_pct || 0).toFixed(2)}%`"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- SCAN TAB -->
            <template x-if="currentTab === 'scan'">
                <div class="space-y-6">
                    <div class="bg-white border rounded-2xl p-6 shadow-sm">
                        <div class="flex justify-between items-center mb-6">
                            <div>
                                <h2 class="text-xl font-black">가치투자 퀀트 스캐너</h2>
                                <p class="text-xs text-gray-400 mt-1">DART 재무제표 + KIS 수급 실시간 분석</p>
                            </div>
                            <button @click="runScan()" 
                                    :disabled="scanning"
                                    class="bg-black text-white px-6 py-2 rounded-xl text-sm font-bold hover:bg-gray-800 disabled:bg-gray-200 transition-all">
                                <span x-show="!scanning">전 종목 스캔 시작</span>
                                <span x-show="scanning" class="flex items-center gap-2">
                                    <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    분석 중...
                                </span>
                            </button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <!-- Scanner A Results -->
                            <div class="border rounded-xl p-4 bg-gray-50">
                                <h3 class="font-black text-sm mb-4 flex items-center justify-between">
                                    박성진식 저평가
                                    <span class="text-[10px] px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full">PBR ≤ 1.0</span>
                                </h3>
                                <div class="space-y-2">
                                    <template x-for="item in scanResults.a" :key="item.ticker">
                                        <div class="bg-white p-3 rounded-lg border shadow-sm flex justify-between items-center">
                                            <div>
                                                <div class="text-xs font-bold" x-text="item.name"></div>
                                                <div class="text-[10px] text-gray-400" x-text="`PBR ${item.pbr}`"></div>
                                            </div>
                                            <div class="text-right">
                                                <div class="text-[10px] font-bold text-red-500" x-text="`저점 대비 ${item.pos_from_low}`"></div>
                                                <div class="text-[10px] text-gray-400" x-text="item.market_cap"></div>
                                            </div>
                                        </div>
                                    </template>
                                    <template x-if="scanResults.a.length === 0">
                                        <div class="text-center py-8 text-xs text-gray-400">데이터가 없습니다.</div>
                                    </template>
                                </div>
                            </div>

                            <!-- Scanner B Results -->
                            <div class="border rounded-xl p-4 bg-gray-50">
                                <h3 class="font-black text-sm mb-4 flex items-center justify-between">
                                    변두식 이익성장
                                    <span class="text-[10px] px-2 py-0.5 bg-green-100 text-green-700 rounded-full">YoY +10%</span>
                                </h3>
                                <div class="space-y-2">
                                    <template x-for="item in scanResults.b" :key="item.ticker">
                                        <div class="bg-white p-3 rounded-lg border shadow-sm">
                                            <div class="flex justify-between items-center">
                                                <div class="text-xs font-bold" x-text="item.name"></div>
                                                <div class="text-[10px] font-bold text-blue-600" x-text="item.reason"></div>
                                            </div>
                                            <div class="text-[10px] text-gray-400 mt-1" x-text="item.status"></div>
                                        </div>
                                    </template>
                                    <template x-if="scanResults.b.length === 0">
                                        <div class="text-center py-8 text-xs text-gray-400">데이터가 없습니다.</div>
                                    </template>
                                </div>
                            </div>

                            <!-- Scanner C Results -->
                            <div class="border rounded-xl p-4 bg-gray-50">
                                <h3 class="font-black text-sm mb-4 flex items-center justify-between">
                                    서희아빠 낙폭과대
                                    <span class="text-[10px] px-2 py-0.5 bg-orange-100 text-orange-700 rounded-full">RSI 과매도</span>
                                </h3>
                                <div class="space-y-2">
                                    <template x-for="item in scanResults.c" :key="item.ticker">
                                        <div class="bg-white p-3 rounded-lg border shadow-sm flex justify-between items-center">
                                            <div>
                                                <div class="text-xs font-bold" x-text="item.name"></div>
                                                <div class="text-[10px] text-gray-400" x-text="item.reason"></div>
                                            </div>
                                            <div class="text-right">
                                                <div class="text-[10px] font-bold text-green-600" x-text="`반등기대 ${item.expected_rebound}`"></div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Market Closed Notice -->
            <div x-show="currentTab === 'dashboard' && !marketOpen()" class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-amber-800 text-xs font-bold text-center mb-6 shadow-sm">
                ⚠ 실시간 데이터 수신 대기 중 — 장중에 데이터가 실시간으로 갱신됩니다
            </div>
        </main>

        <!-- Footer -->
        <footer class="p-8 mt-8 border-t border-gray-100 bg-white">
            <div class="max-w-7xl mx-auto text-center">
                <p class="text-[10px] font-bold uppercase tracking-widest text-gray-400">
                    © 2026 CHECKS Terminal · KIS Open API · Premium Analytics Engine
                </p>
            </div>
        </footer>
    </div>

    <!-- App Script (load before Alpine.js so component is defined) -->
    <script src="/static/js/app.js"></script>

    <!-- Alpine.js for reactivity (load after app.js) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
